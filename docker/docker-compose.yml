version: '3.9'

services:
  postgres:
    container_name: solde-postgres
    image: postgres:alpine
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: 'user'
      POSTGRES_PASSWORD: 'password'
      POSTGRES_DB: 'ddh'
    volumes:
      - solde-postgres:/var/lib/postgresql/data
    networks:
      - postgres

  pgadmin:
    container_name: solde-pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@email.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - 5051:80
    networks:
      - postgres

networks:
  postgres:
    driver: bridge

volumes:
  solde-postgres: